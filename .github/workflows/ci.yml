# Runs the same commands as scripts/ci.sh. The firmware jobs use the ESP-IDF
# image at the version in scripts/esp_idf_version.txt. Keep the tag in sync.
name: "CI"

on:
  push:
  pull_request:

permissions:
  contents: "read"

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: "Shellcheck"
        run: "scripts/ci.sh lint"
      - uses: "DavidAnson/markdownlint-cli2-action@v19"

  python_tests:
    name: "Python tests"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - name: "Install"
        run: "pip install -e ."
      - name: "Run tests"
        run: "scripts/ci.sh python-tests"

  web_tests:
    name: "Web TUI tests"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - uses: "actions/setup-node@v4"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "tests/web/package-lock.json"
      - name: "Build the web TUI bundle and run the Node tests in Pyodide"
        run: "scripts/ci.sh web-tests"

  docker_host:
    name: "Host tool in Docker"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: "Build the image and run the Python tests"
        run: "scripts/bench_docker.sh --test"

  host_tests:
    name: "Firmware host tests"
    runs-on: "ubuntu-latest"
    container: "espressif/idf:v6.1"
    steps:
      - uses: "actions/checkout@v4"
      - name: "Run host tests"
        shell: "bash"
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # Actions does not run the image entrypoint, so load ESP-IDF here.
          . "${IDF_PATH}/export.sh" >/dev/null
          scripts/ci.sh host-tests

  build:
    name: "Build ${{ matrix.target }} ${{ matrix.variant }}"
    runs-on: "ubuntu-latest"
    container: "espressif/idf:v6.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "esp32"
            variant: ""
          - target: "esp32s3"
            variant: ""
          - target: "esp32s3"
            variant: "usb_serial_jtag"
          - target: "esp32c3"
            variant: ""
          - target: "esp32c3"
            variant: "usb_serial_jtag"
          - target: "esp32c6"
            variant: ""
          - target: "esp32c6"
            variant: "usb_serial_jtag"
    steps:
      - uses: "actions/checkout@v4"
      - name: "Build"
        shell: "bash"
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # Actions does not run the image entrypoint, so load ESP-IDF here.
          . "${IDF_PATH}/export.sh" >/dev/null
          scripts/ci.sh build "${{ matrix.target }}" "${{ matrix.variant }}"
      - name: "Collect the merged image for the web flasher"
        id: "image"
        shell: "bash"
        run: |
          name="${{ matrix.target }}"
          if [[ -n "${{ matrix.variant }}" ]]; then
            name="${name}_${{ matrix.variant }}"
          fi
          mkdir -p firmware_images
          cp "firmware/bench_agent/build_ci_${name}/merged-binary.bin" "firmware_images/bench_agent_${name}.bin"
          printf 'name=%s\n' "${name}" >>"${GITHUB_OUTPUT}"
      - uses: "actions/upload-artifact@v4"
        with:
          name: "firmware-${{ steps.image.outputs.name }}"
          path: "firmware_images/"
          if-no-files-found: "error"

  # Publishes the web flasher to GitHub Pages after each push to main. Set the
  # Pages source to "GitHub Actions" in the repository settings first.
  pages:
    name: "Web flasher"
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    needs: ["lint", "python_tests", "web_tests", "host_tests", "build"]
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: "github-pages"
      url: "${{ steps.deploy.outputs.page_url }}"
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      # build_site.sh downloads the wheels of the web TUI with pip.
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - uses: "actions/download-artifact@v4"
        with:
          pattern: "firmware-*"
          path: "firmware_images"
          merge-multiple: true
      - name: "Build the site"
        run: "scripts/build_site.sh --images firmware_images"
      - uses: "actions/configure-pages@v5"
      - uses: "actions/upload-pages-artifact@v3"
        with:
          path: "site"
      - id: "deploy"
        uses: "actions/deploy-pages@v4"
