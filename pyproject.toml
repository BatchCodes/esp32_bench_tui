[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.1.0"
description = "Terminal UI for bench tests of ESP32 boards"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "PyYAML>=6.0",
  "textual>=2.1",
]

[project.scripts]
bench = "bench.__main__:main"

[tool.setuptools.packages.find]
where = ["host"]

[tool.setuptools.package-data]
bench = ["tui/*.tcss"]
