name: esp32_c6_devkitc_1
title: Espressif ESP32-C6-DevKitC-1
chip: esp32c6
flash_mb: 8
psram_mb: 0
link: uart0
usb: "Two USB ports. The UART port has a USB-UART bridge on UART0. The USB port is the native USB-Serial-JTAG port."
verified: false
sources:
  - "Espressif ESP32-C6-DevKitC-1 v1.2 user guide, header block tables J1 and J3"
  - "ESP32-C6-DevKitC-1 user guide, header block table, https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32c6/esp32-c6-devkitc-1/"
pins: all
reserved: {}
notes:
  8: "RGB LED (WS2812) data."
onboard:
  - id: boot_button
    gpio: 9
    type: button
    active_low: true
    notes: "BOOT button. Do not hold it at reset."
# Header pins from the antenna end to the USB end. J1 is on the left and J3
# on the right, with the board in portrait and the parts facing you. The pin
# order is from the source. The side and the end are not checked on a board yet.
header_left: ["3V3", "RST", 4, 5, 6, 7, 0, 1, 8, 10, 11, 2, 3, "5V", "GND", "NC"]
header_right: ["GND", 16, 17, 15, 23, 22, 21, 20, 19, 18, 9, "GND", 13, 12, "GND", "NC"]
