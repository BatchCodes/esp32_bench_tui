name: esp32_devkitc
title: Espressif ESP32-DevKitC (ESP32-WROOM-32)
chip: esp32
flash_mb: 4
psram_mb: 0
link: uart0
usb: "CP2102 or CH9102 USB-UART bridge on UART0"
verified: false
sources:
  - "Espressif ESP32-DevKitC V4 user guide, header block tables J2 and J3"
  - "ESP32-DevKitC V4 user guide, header block table, https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32/esp32-devkitc/"
pins: all
labels:
  36: "VP"
  39: "VN"
reserved: {}
onboard:
  - id: boot_button
    gpio: 0
    type: button
    active_low: true
    notes: "BOOT button. Do not hold it at reset."
# Header pins from the antenna end to the USB end. J2 is on the left and J3
# on the right, with the board in portrait and the parts facing you. The pin
# order is from the source. The side and the end are not checked on a board yet.
header_left: ["3V3", "EN", 36, 39, 34, 35, 32, 33, 25, 26, 27, 14, 12, "GND", 13, 9, 10, 11, "5V"]
header_right: ["GND", 23, 22, 1, 3, 21, "GND", 19, 18, 5, 17, 16, 4, 0, 2, 15, 8, 7, 6]
